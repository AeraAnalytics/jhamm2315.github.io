[project]
name = "aera-operations"
version = "0.1.0"
description = "Local opportunity research and paperwork operations backend"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
research = ["openai-agents>=0.2,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
aera = "aera.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
